# Data sources. `dir` is relative to the data directory ($VSAFE_DATA_DIR, default ./data).
# URLs copied from https://icandecide.org/v-safe-data/ on 2026-11-08 (all returned HTTP 200).
# Local names are short (r01.xlsx ...); the url keeps the original file name.
# record the sha256 of every file on download (vsafe-ft download writes it to data/raw/MANIFEST.tsv).
# Hosts that must be allowed in a cloud session's network settings:
#   filedev0128.s3.us-east-1.amazonaws.com  (free text, Nov 2024 MedDRA)
#   filedev0128.s3.amazonaws.com            (registrants, vaccinations, check-ins)
#   ican-public.s3.amazonaws.com            (older MedDRA, call center)
# VAERS yearly zips sit behind a CAPTCHA: download by hand into <data dir>/raw/vaers/.

