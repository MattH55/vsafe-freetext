# Fixed analysis parameters. Changes after OSF registration are filed as OSF amendments.
min_cell_people: 10            # suppress any aggregate cell under this many distinct people
max_days_since_dose: 400       # entries beyond this are flagged
outcome_window_days: 90        # call-center / VAERS outcomes linked within this window after an entry
join_rate_gate: 0.90           # registrant and survey key match rate required at gate 1
theme_precision_gate: 0.85     # per-theme precision and recall on the gold set for confirmatory reporting
theme_recall_gate: 0.85
model_shift_flag: 0.20         # theme count shift between models that flags a theme as model-sensitive
alpha: 0.05
ci_level: 0.95
permutations: 1000             # Q1 co-occurrence null, preserving domain marginals
gold_set_size: 2000
long_term_surveys: [3m, 6m, 12m]

# Pre-registration guard (brief rule 5). Until osf_registration is set, classification and the
# case definition run only on entries whose matched check-in is a week-1 or six-week survey
# (survey_day <= exploratory_max_survey_day and survey_type not long-term).
osf_registration: "https://osf.io/gnfpd"   # registered 2026-11-11 (embargoed); project osf.io/7wpgy
# Amendment 1 (docs/preregistration/amendment-1.md): CDC MedDRA coding replaces the two-coder
# gold set. validate.meddra_reference refuses to run until this is set to the filed amendment.
amendment_1: null
exploratory_max_survey_day: 42
