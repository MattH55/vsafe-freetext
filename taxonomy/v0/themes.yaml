# DRAFT taxonomy v0 (not frozen). Frozen as v1.0 and attached to the OSF registration
# before any gold-set result is used to tune the classifier.
# Backbone: MedDRA SOC -> HLGT (mapping table to be added: taxonomy/v0/meddra_map.csv).
# The eight PACVS candidate domains are themes here, so the phenotype is a query over aggregates.
# Terms are regexes matched case-insensitively; wrap a term in (?-i:...) to make it case-sensitive.
version: v0-draft

themes:
  # --- PACVS candidate domains ---
  fatigue_pem:
    domain: pacvs
    terms: [fatigue, fatigued, exhausted, exhaustion, tired, tiredness, "no energy", lethargic,
            "post.exertional", "crash(?:ed|es)?", "wiped out", malaise]
  cognitive:
    domain: pacvs
    terms: ["brain fog", foggy, "memory (?:loss|problems?|issues?)", forgetful,
            "(?:can't|cannot|trouble|difficulty) concentrat\\w*", confusion, confused]
  dysautonomia:
    domain: pacvs
    terms: ["palpitations?", "racing heart", "heart racing", tachycardia, "fast heart ?rate",
            "(?-i:POTS)", "dizz(?:y|iness)", "light[ -]?headed(?:ness)?", "heat intolerance", "pounding heart",
            "(?:elevated|high|increased|rapid|racing) (?:heart ?rate|pulse)", vertigo]
  sensory_neuropathic:
    domain: pacvs
    terms: [tingling, "pins and needles", "numb(?:ness)?", burning, "paresthesias?", "paraesthesias?",
            tinnitus, "ringing in (?:my |the )?ears?", "blurr(?:y|ed) vision", neuropathy]
  sleep:
    domain: pacvs
    terms: [insomnia, "can't sleep", "cannot sleep", "trouble sleeping", "night sweats",
            "unrefreshing sleep"]
  pain:
    domain: pacvs
    terms: ["headaches?", "migraines?", "muscle (?:aches?|pain)", myalgia, "joint (?:pain|aches?)",
            arthralgia, "chest pain", "body aches?",
            "(?:back|neck|jaw|hip|knee|leg|ear) (?:pain|aches?)", "achy", "aching"]
  gastrointestinal:
    domain: pacvs
    terms: [nausea, nauseous, "vomit\\w*", "diarrh(?:o)?ea", "stomach (?:pain|ache|cramps?)",
            "abdominal pain", bloating, constipation, "upset stomach",
            "(?:loss of|lost my|no|decreased|poor) appetite"]
  menstrual:
    domain: pacvs
    # "period(s)" only when not "period(s) of ..." and not "short/long/... period" (time spans)
    terms: ["(?<!short )(?<!long )(?<!brief )(?<!same )(?<!time )(?<!trial )(?<!grace )(?<!waiting )periods?(?!\\s+of\\b)",
            "menstrua\\w*", "heavy bleeding", spotting, "missed period",
            "irregular (?:cycle|period)s?"]

  # --- lay-reporting layer (not in the MedDRA backbone) ---
  persistence:
    domain: lay
    terms: ["still (?:have|having|feel|feeling)", "since (?:the|my) (?:shot|vaccine|dose)",
            "(?:for|over) (?:\\d+|several|many) (?:weeks|months)", "hasn't gone away", ongoing,
            "not (?:gone|better|improved)"]
  care_sought:
    domain: lay
    terms: ["(?:went to|visited|saw) (?:the |my )?(?:er|emergency|urgent care|doctor|hospital)",
            "hospitali[sz]ed", admitted, "emergency room"]
  missed_work_school:
    domain: lay
    terms: ["missed (?:work|school)", "(?:couldn't|could not|unable to) (?:work|go to work)",
            "(?:called|call) (?:in )?sick"]
  pre_existing_worsened:
    domain: lay
    terms: ["flare(?:d|-up)?", "worse(?:ned)? my", "made my .{1,30} worse"]

  # --- exclusions for case-definition criterion 3 (docs/protocol.md) ---
  # Draft lists; refined before the taxonomy is frozen. Not PACVS domains.
  acute_diagnosis:
    domain: exclusion
    terms: [myocarditis, pericarditis, "anaphyla\\w*", "bell'?s palsy", "guillain.barr[eé]",
            "(?-i:GBS)", "blood clots?", "deep vein thrombosis", "(?-i:DVT)", "pulmonary embolism",
            stroke, "heart attack", appendicitis, shingles, "kidney stones?", "gall ?bladder"]
  unrelated_cause:
    domain: exclusion
    terms: ["(?:had|have|caught|got|positive for|tested positive for) (?:covid|the flu|a cold|strep)",
            "covid (?:infection|positive)", "tested positive", "positive (?:covid|test)",
            "seasonal allergies", "sinus infection", "(?-i:UTI)", "urinary tract infection",
            "ear infection", "food poisoning", "pregnan\\w*", "morning sickness",
            "(?:car|work) accident", "fell (?:down|off|and)", "broke my", "fractur\\w*",
            "sprain\\w*", "pulled a muscle", "injur(?:y|ed)"]

  # --- acute reaction profile (domain: acute) -------------------------------------------
  # Proposed 2026-11-09 from the release-1 n-gram pass (candidate n-grams in entries no theme
  # matched, >= 10 people each; aggregate counts in docs/phase1-report.md). Not PACVS domains
  # and not exclusions: they describe the expected week-1 reaction profile so it is labelled
  # rather than left as "unthemed". Whether any of them should count as a criterion-3
  # exclusion (e.g. upper_respiratory as a likely cold) is a protocol decision for the human.
  injection_site:
    domain: acute
    terms: ["injection (?:site|arm|side|area)", "(?:at|around|near|on) (?:the )?(?:injection|shot) (?:site|area)",
            "sore (?:arm|shoulder)", "(?:arm|shoulder) (?:pain|soreness|is sore|hurts)",
            "(?:pain|soreness|sore) (?:in|on) (?:my |the )?(?:left |right |upper )?arm",
            "bruis\\w*", "(?:at|around) (?:the )?site"]
  lymphadenopathy:
    domain: acute
    terms: ["lymph ?nodes?", lymphadenopathy, "swollen (?:glands?|nodes?)", "axilla\\w*",
            "arm ?pits?", "under (?:my |the )?arm"]
  upper_respiratory:
    domain: acute
    terms: ["sore throat", "scratchy throat", "runny nose", "stuffy nose", "(?:nasal|sinus) congestion",
            "congest\\w*", "sneez\\w*", "post.?nasal drip", "cough\\w*", "nasal drainage"]
  fever_chills:
    domain: acute
    terms: ["fever\\w*", chills, "hot flash\\w*", "flush(?:ed|ing)", "sweat(?:s|ing|y)?"]
  skin:
    domain: acute
    terms: [rash, "rashes", hives, urticaria, "itch\\w*"]
  taste_smell:
    domain: acute
    # loss of taste/smell is also a long-COVID feature: flag for the protocol owner
    terms: ["metallic taste", "(?:loss of|lost(?: my| the)?|no|altered|changes? in) (?:taste|smell)",
            "taste in (?:my |the )?mouth", "dry mouth"]
  cardiorespiratory:
    domain: acute
    # dyspnoea and chest tightness overlap PACVS exercise intolerance: flag for the protocol owner
    terms: ["short(?:ness)? of breath", "(?:difficulty|trouble) breathing", "chest (?:tightness|pressure)",
            "tight(?:ness in (?:my |the )?)? chest"]
